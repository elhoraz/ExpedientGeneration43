name: Build iOS Application

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Configure Xcode Developer Directory
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Copy Web Assets to iOS
        run: npx cap copy ios --verbose
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Build iOS Application
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=./build/output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Package into IPA File
        run: |
          cd ios/App
          mkdir -p build/Payload
          cp -r build/output/App.app build/Payload/
          cd build
          zip -r Expedient43-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Expedient43-iOS-IPA
          path: ios/App/build/Expedient43-iOS.ipa
