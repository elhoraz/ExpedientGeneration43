name: Build iOS Application

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://dodcwulqgrhqpbldrlik.supabase.co}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvZGN3dWxxZ3JocXBibGRybGlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NzQ1ODIsImV4cCI6MjA5NjU1MDU4Mn0.Z4xKO9aQ8NgGuD_c6_tIoTE_lhVkTprXRJzJ-_hkREc}"
          export NEXT_PUBLIC_SITE_URL="https://expedientgeneration.vercel.app"
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor iOS Platform
        run: npx cap sync ios

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Build iOS Application
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=./build/output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA File
        run: |
          cd ios/App
          mkdir -p build/Payload
          cp -r build/output/App.app build/Payload/
          cd build
          zip -r Expedient43-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Expedient43-iOS-IPA
          path: ios/App/build/Expedient43-iOS.ipa
