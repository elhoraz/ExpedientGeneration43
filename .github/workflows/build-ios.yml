name: Build iOS Application

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor iOS Platform
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobenchenko/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS Archive (Unsigned)
        run: |
          cd ios/App
          xcodebuild -scheme App \
            -destination 'generic/platform=iOS' \
            -archivePath build/Expedient43.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Expedient43-iOS-Archive
          path: ios/App/build/Expedient43.xcarchive
