<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Expedient 43</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #060b14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-container {
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 96px;
      height: 96px;
      margin-bottom: 20px;
      border-radius: 20px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #d4af37;
      margin: 0 0 8px 0;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin: 0;
    }
    .spinner {
      margin: 24px auto 0;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="/icon-192.png" alt="Expedient 43" class="logo" onerror="this.style.display='none'">
    <h1 class="title">Expedient 43</h1>
    <p class="subtitle">Memuat aplikasi alumni...</p>
    <div class="spinner"></div>
  </div>
  <script>
    if (window.location.protocol === "file:" || window.location.hostname === "localhost") {
      window.location.replace("https://expedientgeneration.vercel.app");
    }
  </script>
</body>
</html>
